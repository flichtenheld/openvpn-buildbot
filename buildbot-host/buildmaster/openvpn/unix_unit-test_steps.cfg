# -*- python -*-
# ex: set filetype=python:
def openvpnAddUnixUnitTestStepsToBuildFactory(factory, combo, shell_env=None):
    if shell_env is None:
        shell_env = {}

    factory.addStep(
        steps.ShellCommand(
            command=["make", "-j", "2", "build-tests"],
            name="tests build",
            description="building unit-tests",
            descriptionDone="build unit-tests",
            env=shell_env,
        )
    )

    factory.addStep(
        steps.ShellCommand(
            command=["make", "-C", "tests/unit_tests", "-j", "4", "check", "VERBOSE=1"],
            name="unit-tests",
            description="running unit-tests",
            descriptionDone="run unit-tests",
            env=shell_env,
        )
    )

    return factory
