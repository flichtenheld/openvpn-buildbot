# -*- python -*-
# ex: set filetype=python:
def openvpnAddCheckStepsToBuildFactory(factory, combo, shell_env=None):
    if shell_env is None:
        shell_env = {}

    factory.addStep(
        steps.ShellCommand(
            command=["make", "-j", "2", "build-tests"],
            env=shell_env,
            name="tests build",
            description="building tests",
            descriptionDone="build tests",
            sigtermTime=5,
        )
    )

    # Run the tests, including t_client.sh and t_server_null.sh
    factory.addStep(
        steps.ShellCommand(
            command=["make", "-j", "2", "check", "VERBOSE=1"],
            env=shell_env,
            name="run tests",
            description="testing",
            descriptionDone="test",
            sigtermTime=5,
        )
    )

    factory.addStep(
        steps.ShellCommand(
            command="ccache -s",
            decodeRC={0: SUCCESS, 127: WARNINGS},
            name="ccache show (make check)",
            description="showing stats",
            descriptionDone="ccache stats",
            env=shell_env,
            doStepIf=lambda s: s.getProperty("use_ccache", False),
        )
    )

    return factory
